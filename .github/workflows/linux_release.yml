name: Linux Qt AppImage Release

permissions:
  contents: write

on:
  # Tag အသစ်တစ်ခု (ဥပမာ: v1.0.0) push လုပ်မှသာ အလုပ်လုပ်မည်
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # branches:
    #   - arc-humble-release
  # Manual trigger ကို ခွင့်ပြုခြင်း (GitHub UI မှ Run workflow နှိပ်ပြီး run လို့ရမည်)
  workflow_dispatch:

jobs:
  build_linux_appimage:
    runs-on: ubuntu-22.04 # Linux Build အတွက်

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Install Qt 6.8.2
        # Qt ကို အလိုအလျောက် Install လုပ်ပေးမယ့် Action
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'desktop'

      - name: 2.5. Install xcb-cursor library
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0

      - name: 3. Create Build Directory
        run: mkdir -p build

      - name: 4. Configure CMake
        # Qt 6 ကို CMake ဖြင့် သုံးသောအခါ CMAKE_PREFIX_PATH ကို သတ်မှတ်ပေးရန် လိုအပ်သည်
        run: |
          cmake -S rsync_qt -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

      - name: 5. Build Qt Application (Release)
        run: cmake --build build --config Release -j$(nproc)

      - name: 5.5. Install Qt Application
        run: cmake --install build

      - name: 6. Deploy with linuxdeploy + Qt plugin
        # Qt 6 QML/Quick app အတွက် linuxdeploy + linuxdeploy-plugin-qt သုံးခြင်း
        env:
          QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/rsync_qt
        run: |
          # linuxdeploy နှင့် Qt plugin ကို download လုပ်ခြင်း
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # AppDir ဖွဲ့စည်းပုံကို စတင်တည်ဆောက်ခြင်း
          mkdir -p AppDir/usr/bin
          cp install/bin/apprsync_qt AppDir/usr/bin/

          # Icon ဖန်တီးခြင်း
          ICON_SRC="rsync_qt/icon.png"
          if [ -f "$ICON_SRC" ]; then
            mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
            cp "$ICON_SRC" AppDir/usr/share/icons/hicolor/256x256/apps/apprsync_qt.png
            echo "Copied project icon"
          else
            # Placeholder icon ဖန်တီးခြင်း (256x256 blue square)
            sudo apt-get install -y imagemagick
            mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
            convert -size 256x256 xc:'#2196F3' -gravity center \
              -fill white -font DejaVu-Sans-Bold -pointsize 48 \
              -annotate 0 'rsync\nQt' AppDir/usr/share/icons/hicolor/256x256/apps/apprsync_qt.png
            echo "Generated placeholder icon"
          fi

          # .desktop file ဖန်တီးခြင်း
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/apprsync_qt.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Rsync Qt
          Comment=Lightweight rsync/ssh Qt helper
          Exec=apprsync_qt
          Icon=apprsync_qt
          Categories=System;Utility;Qt;
          Version=1.0
          DESKTOP

          # linuxdeploy ဖြင့် AppImage ဖန်တီးခြင်း
          # --plugin qt က Qt libs, QML modules, plugins များကို အလိုအလျောက် ထည့်သွင်းပေးမည်
          OUTPUT="Rsync_Qt-x86_64.AppImage" ./linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/apprsync_qt.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/apprsync_qt.png \
            --plugin qt \
            --output appimage

      - name: 7. Rename AppImage for Release
        # Tag နာမည် (ဥပမာ v1.0.0) ကို ဖိုင်နာမည်မှာ ထည့်ပြီး ပြင်ဆင်ခြင်း
        id: rename_appimage
        run: |
          # Tag push ဖြစ်လျှင် tag name ကို သုံးမည်၊ မဟုတ်လျှင် commit SHA ကို သုံးမည်
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME=${{ github.ref_name }}
          else
            VERSION_NAME="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          
          # Find the generated AppImage file
          APPIMAGE_FILE=$(ls Rsync_Qt-x86_64.AppImage 2>/dev/null || ls *-x86_64.AppImage 2>/dev/null | head -n1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "Error: No AppImage file found"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE_FILE"
          FINAL_NAME="rsync_qt-linux-${VERSION_NAME}.AppImage"
          mv "$APPIMAGE_FILE" "$FINAL_NAME"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "appimage_file=${FINAL_NAME}" >> $GITHUB_OUTPUT

      - name: 7.5. Upload AppImage as Artifact (for non-tag builds)
        # Tag မဟုတ်ဘဲ branch push များအတွက် artifact အဖြစ် upload လုပ်ခြင်း
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-Linux
          path: ${{ steps.rename_appimage.outputs.appimage_file }}
          retention-days: 30

      - name: 8. Upload AppImage as GitHub Release Asset
        # softprops/action-gh-release ကို သုံးပြီး release assets တင်ခြင်း
        # Tag push ဖြစ်မှသာ Release တင်မည် (branch push များတွင် skip လုပ်မည်)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          # Tag ကို အသုံးပြုခြင်း
          tag_name: ${{ github.ref_name }}
          # Asset အဖြစ် တင်မည့် ဖိုင်
          files: ${{ steps.rename_appimage.outputs.appimage_file }}
          # Release Notes အလိုအလျောက် ရေးသားခြင်း
          body: |
            ## 🎉 Release ${{ github.ref_name }} (Linux)

            This release contains the AppImage binary for the Linux platform.

            * Built with **Qt 6.8.2** and **CMake**.
